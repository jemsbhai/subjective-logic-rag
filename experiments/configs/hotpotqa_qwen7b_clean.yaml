# HotpotQA — Qwen 2.5 7B — Clean (no corruption)
# Run on: 4090 (Muntaser)
name: hotpotqa_qwen7b_clean
seed: 42

dataset:
  name: hotpotqa
  split: validation
  max_samples: 500

retrieval:
  method: gold
  top_k: 10

corruption:
  type: null
  level: 0.0

estimation:
  method: nli
  batch_size: 32

pipeline:
  fusion_strategy: cumulative
  default_trust_belief: 0.9
  half_life: 168.0
  conflict_threshold: 0.3
  tau_abstain: 0.7
  tau_conflict: 0.5

baselines:
  run_softmax: true
  run_retrieval_conf: true
  run_semantic_entropy: false
  run_p_true: true
  run_combined_heuristic: true
  run_conformal: true

generation:
  model_path: E:\data\code\claudecode\models\Qwen2.5-7B-Instruct
  load_in_4bit: true
  max_new_tokens: 128
  device: cuda

output:
  results_dir: experiments/results
  save_predictions: true
